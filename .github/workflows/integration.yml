name: Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js for the workspace runner
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
          pub-cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Run Flutter conformance gate
        run: node scripts/run-flutter-conformance.mjs

      - name: Record Flutter summary
        if: always()
        run: |
          {
            echo "### RelGeo Flutter conformance"
            echo "- Flutter channel: stable"
            echo "- Flutter version: 3.41.9"
            echo "- Runner: scripts/run-flutter-conformance.mjs"
            echo "- Gate is independent of TypeScript/package jobs"
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
          pub-cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Build macOS release
        working-directory: flutter
        run: flutter build macos --no-pub --release

      - name: Assert and archive macOS release
        working-directory: flutter
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/relgeo_flutter.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/relgeo_flutter"
          archive="$RUNNER_TEMP/relgeo_flutter-macos-${{ runner.arch }}-${{ github.sha }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          echo "RELGEO_MACOS_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-flutter-macos-${{ runner.arch }}-${{ github.sha }}
          path: ${{ env.RELGEO_MACOS_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

      - name: Record macOS build summary
        if: always()
        run: |
          {
            echo "### RelGeo Flutter macOS build"
            echo "- Flutter channel: stable"
            echo "- Flutter version: 3.41.9"
            echo "- Command: flutter build macos --no-pub --release"
            echo "- Runner: macos-latest"
            echo "- Artifact: relgeo-flutter-macos-${{ runner.arch }}-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
          pub-cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Run Linux analyzer baseline
        working-directory: flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Build Linux release
        working-directory: flutter
        run: flutter build linux --no-pub --release

      - name: Assert and archive Linux release
        working-directory: flutter
        run: |
          set -euo pipefail
          bundle="build/linux/x64/release/bundle"
          test -x "$bundle/relgeo_flutter"
          test -d "$bundle/data"
          test -d "$bundle/lib"
          archive="$RUNNER_TEMP/relgeo_flutter-linux-x64-${{ github.sha }}.tar.gz"
          tar -czf "$archive" -C "$bundle" .
          echo "RELGEO_LINUX_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-flutter-linux-x64-${{ github.sha }}
          path: ${{ env.RELGEO_LINUX_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

      - name: Record Linux build summary
        if: always()
        run: |
          {
            echo "### RelGeo Flutter Linux build"
            echo "- Flutter channel: stable"
            echo "- Flutter version: 3.41.9"
            echo "- Command: flutter build linux --no-pub --release"
            echo "- Runner: ubuntu-latest"
            echo "- Artifact: relgeo-flutter-linux-x64-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
          pub-cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Run Windows analyzer baseline
        working-directory: flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Build Windows release
        working-directory: flutter
        run: flutter build windows --no-pub --release

      - name: Assert and archive Windows release
        id: windows-archive
        working-directory: flutter
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/windows" -Recurse -Filter "relgeo_flutter.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "relgeo_flutter.exe was not found under build/windows" }
          $release = $exe.Directory.FullName
          $dll = Join-Path $release "flutter_windows.dll"
          $data = Join-Path $release "data"
          if (-not (Test-Path $dll)) { throw "flutter_windows.dll is missing from $release" }
          if (-not (Test-Path $data -PathType Container)) { throw "data directory is missing from $release" }
          $archive = Join-Path $env:RUNNER_TEMP "relgeo_flutter-windows-x64-${{ github.sha }}.zip"
          Compress-Archive -Path (Join-Path $release "*") -DestinationPath $archive -CompressionLevel Optimal
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-flutter-windows-x64-${{ github.sha }}
          path: ${{ steps.windows-archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Record Windows build summary
        if: always()
        shell: pwsh
        run: |
          @(
            "### RelGeo Flutter Windows build",
            "- Flutter channel: stable",
            "- Flutter version: 3.41.9",
            "- Command: flutter build windows --no-pub --release",
            "- Runner: windows-latest",
            "- Artifact: relgeo-flutter-windows-x64-${{ github.sha }}"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check contract compatibility matrix
        run: pnpm run compatibility:check

      - name: Audit compatibility behavior inventory
        run: pnpm run compatibility:audit

      - name: Check release decision record
        run: pnpm run release:record:check

      - name: Run local-workspace integration gate
        run: pnpm run integration:gate -- --local --report=.local/integration-gate.json

      - name: Audit npm release boundaries
        run: pnpm run release:audit

      - name: Upload integration gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-integration-gate-report
          path: .local/integration-gate.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record integration summary
        if: always()
        run: |
          {
            echo "### RelGeo local-workspace integration"
            echo "- Compatibility line: 0.5"
            echo "- Workspace revision: $(git rev-parse HEAD)"
            echo "- Baseline manifest: docs/integration-baseline.json"
          } >> "$GITHUB_STEP_SUMMARY"

  public:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Run public-registry integration gate
        run: pnpm run integration:public -- --report=.local/integration-public.json

      - name: Upload public integration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-public-integration-report
          path: .local/integration-public.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record public integration summary
        if: always()
        run: |
          {
            echo "### RelGeo public-registry integration"
            echo "- Compatibility line: 0.5"
            echo "- Workspace revision: $(git rev-parse HEAD)"
            echo "- Consumer dependencies: npm registry"
          } >> "$GITHUB_STEP_SUMMARY"
