name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Run local-workspace integration gate
        run: pnpm run integration:gate -- --local --report=.local/integration-gate.json

      - name: Upload integration gate report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relgeo-integration-gate-report
          path: .local/integration-gate.json
          if-no-files-found: warn
