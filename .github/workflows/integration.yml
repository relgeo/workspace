name: Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js for the workspace runner
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
          pub-cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Run Flutter conformance gate
        run: node scripts/run-flutter-conformance.mjs

      - name: Record Flutter summary
        if: always()
        run: |
          {
            echo "### RelGeo Flutter conformance"
            echo "- Flutter channel: stable"
            echo "- Flutter version: 3.41.9"
            echo "- Runner: scripts/run-flutter-conformance.mjs"
            echo "- Gate is independent of TypeScript/package jobs"
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
          pub-cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Build macOS release
        working-directory: flutter
        run: flutter build macos --no-pub --release

      - name: Record macOS build summary
        if: always()
        run: |
          {
            echo "### RelGeo Flutter macOS build"
            echo "- Flutter channel: stable"
            echo "- Flutter version: 3.41.9"
            echo "- Command: flutter build macos --no-pub --release"
            echo "- Runner: macos-latest"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check contract compatibility matrix
        run: pnpm run compatibility:check

      - name: Audit compatibility behavior inventory
        run: pnpm run compatibility:audit

      - name: Check release decision record
        run: pnpm run release:record:check

      - name: Run local-workspace integration gate
        run: pnpm run integration:gate -- --local --report=.local/integration-gate.json

      - name: Audit npm release boundaries
        run: pnpm run release:audit

      - name: Upload integration gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-integration-gate-report
          path: .local/integration-gate.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record integration summary
        if: always()
        run: |
          {
            echo "### RelGeo local-workspace integration"
            echo "- Compatibility line: 0.5"
            echo "- Workspace revision: $(git rev-parse HEAD)"
            echo "- Baseline manifest: docs/integration-baseline.json"
          } >> "$GITHUB_STEP_SUMMARY"

  public:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Run public-registry integration gate
        run: pnpm run integration:public -- --report=.local/integration-public.json

      - name: Upload public integration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relgeo-public-integration-report
          path: .local/integration-public.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record public integration summary
        if: always()
        run: |
          {
            echo "### RelGeo public-registry integration"
            echo "- Compatibility line: 0.5"
            echo "- Workspace revision: $(git rev-parse HEAD)"
            echo "- Consumer dependencies: npm registry"
          } >> "$GITHUB_STEP_SUMMARY"
