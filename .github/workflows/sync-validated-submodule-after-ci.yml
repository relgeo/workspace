name: Sync validated submodule baseline

on:
  repository_dispatch:
    types: [submodule_ci_succeeded, flutter_ci_succeeded]
  workflow_dispatch:
    inputs:
      submodule:
        description: Submodule to synchronize
        required: true
        type: choice
        options:
          - flutter
          - playground
          - mcp
      sha:
        description: Full 40-character child repository commit SHA
        required: true
        type: string
      run_id:
        description: Successful child CI run ID for this SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: >-
    sync-submodule-${{
      github.event.client_payload.submodule ||
      (github.event.action == 'flutter_ci_succeeded' && 'flutter') ||
      inputs.submodule || 'manual'
    }}
  cancel-in-progress: true

jobs:
  sync:
    name: Validate and propose submodule pointer update
    if: >-
      ${{
        (github.event_name == 'repository_dispatch' &&
          (github.event.action == 'submodule_ci_succeeded' ||
           github.event.action == 'flutter_ci_succeeded')) ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read and validate dispatch metadata
        id: metadata
        uses: actions/github-script@v7
        env:
          EVENT_TYPE: ${{ github.event.action }}
          PAYLOAD_SUBMODULE: ${{ github.event.client_payload.submodule }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_PATH: ${{ github.event.client_payload.path }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || github.event.client_payload.submodule_sha || github.event.client_payload.flutter_sha }}
          PAYLOAD_RUN_ID: ${{ github.event.client_payload.run_id || github.event.client_payload.submodule_run_id || github.event.client_payload.flutter_run_id }}
          PAYLOAD_WORKFLOW: ${{ github.event.client_payload.workflow || github.event.client_payload.submodule_workflow || github.event.client_payload.flutter_workflow }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch }}
          INPUT_SUBMODULE: ${{ inputs.submodule }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const { validateDispatchMetadata } = require('./scripts/child-ci-sync-policy.cjs');
            const result = validateDispatchMetadata({
              eventType: process.env.EVENT_TYPE,
              payloadSubmodule: process.env.PAYLOAD_SUBMODULE,
              inputSubmodule: process.env.INPUT_SUBMODULE,
              payloadSha: process.env.PAYLOAD_SHA,
              inputSha: process.env.INPUT_SHA,
              payloadRunId: process.env.PAYLOAD_RUN_ID,
              inputRunId: process.env.INPUT_RUN_ID,
              payloadRepository: process.env.PAYLOAD_REPOSITORY,
              payloadPath: process.env.PAYLOAD_PATH,
              payloadWorkflow: process.env.PAYLOAD_WORKFLOW,
              payloadBranch: process.env.PAYLOAD_BRANCH,
            });
            if (!result.ok) {
              core.setFailed(result.errors.join('; '));
              return;
            }
            for (const [key, value] of Object.entries({
              submodule: result.submodule,
              repository: result.repository,
              path: result.path,
              workflow: result.workflow,
              sha: result.sha,
              run_id: result.runId,
              sync_branch: result.syncBranch,
            })) core.setOutput(key, value);

      - name: Verify the successful child CI run
        id: verify-run
        uses: actions/github-script@v7
        env:
          SUBMODULE: ${{ steps.metadata.outputs.submodule }}
          SOURCE_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          SOURCE_WORKFLOW: ${{ steps.metadata.outputs.workflow }}
          SUBMODULE_SHA: ${{ steps.metadata.outputs.sha }}
          SUBMODULE_RUN_ID: ${{ steps.metadata.outputs.run_id }}
          REQUIRED_TOKEN_PERMISSION: actions:read
        with:
          github-token: ${{ secrets.SUBMODULE_CI_VERIFY_TOKEN || secrets.FLUTTER_CI_VERIFY_TOKEN || github.token }}
          script: |
            const { validateWorkflowRun } = require('./scripts/child-ci-sync-policy.cjs');
            const runId = Number(process.env.SUBMODULE_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: 'relgeo',
              repo: process.env.SOURCE_REPOSITORY,
              run_id: runId,
            });

            const result = validateWorkflowRun({
              run,
              expectedSha: process.env.SUBMODULE_SHA,
              expectedWorkflow: process.env.SOURCE_WORKFLOW,
              sourceRepository: process.env.SOURCE_REPOSITORY,
            });
            if (!result.ok) {
              core.setFailed(`${process.env.SUBMODULE} CI validation failed: ${result.failures.join('; ')}`);
              return;
            }

            core.setOutput('run_url', run.html_url);
            core.info(`Validated ${process.env.SUBMODULE} ${process.env.SUBMODULE_SHA} from ${run.html_url} with ${process.env.REQUIRED_TOKEN_PERMISSION}.`);

      - name: Checkout workspace and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Verify canonical sync-runner contract
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "10.33.3"
          test -z "$(git status --porcelain)"
          if git submodule status --recursive | grep -q '^-'; then
            echo "An expected submodule is not initialized" >&2
            exit 1
          fi
          curl -fsSIL --max-time 10 https://registry.npmjs.org/

      - name: Fetch and stage the validated submodule gitlink
        id: stage
        env:
          SUBMODULE_PATH: ${{ steps.metadata.outputs.path }}
          SUBMODULE_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          current_sha="$(git ls-tree HEAD "$SUBMODULE_PATH" | awk '{print $3}')"
          if [ "$current_sha" = "$SUBMODULE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "workspace already points to $SUBMODULE_PATH@$SUBMODULE_SHA"
            exit 0
          fi

          git -C "$SUBMODULE_PATH" fetch --no-tags origin "$SUBMODULE_SHA"
          test "$(git -C "$SUBMODULE_PATH" rev-parse FETCH_HEAD)" = "$SUBMODULE_SHA"
          git -C "$SUBMODULE_PATH" checkout --detach "$SUBMODULE_SHA"
          test -z "$(git -C "$SUBMODULE_PATH" status --porcelain)"
          test "$(git -C "$SUBMODULE_PATH" rev-parse HEAD)" = "$SUBMODULE_SHA"
          git add "$SUBMODULE_PATH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        if: steps.stage.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Regenerate and validate the integration baseline
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/verify-baseline.mjs --write
          git add docs/integration-baseline.json
          pnpm run verify:baseline:strict
          pnpm run compatibility:check
          pnpm run baseline:sync:check

      - name: Capture reproducible bootstrap and synchronization reports
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p .local
          node scripts/bootstrap.mjs --skip-submodules --skip-install --report=.local/bootstrap-report.json
          node scripts/check-baseline-synchronization.mjs --json --report=.local/baseline-synchronization-report.json

      - name: Write validated child CI provenance
        if: steps.stage.outputs.changed == 'true'
        id: provenance
        env:
          SUBMODULE: ${{ steps.metadata.outputs.submodule }}
          SOURCE_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          SOURCE_PATH: ${{ steps.metadata.outputs.path }}
          SOURCE_WORKFLOW: ${{ steps.metadata.outputs.workflow }}
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.metadata.outputs.run_id }}
          SOURCE_RUN_URL: ${{ steps.verify-run.outputs.run_url }}
          SYNC_BRANCH: ${{ steps.metadata.outputs.sync_branch }}
        run: |
          set -euo pipefail
          mkdir -p .local
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const baseline = JSON.parse(fs.readFileSync('docs/integration-baseline.json', 'utf8'));
          const sourcePath = process.env.SOURCE_PATH;
          const child = baseline.submodules.find((entry) => entry.path === sourcePath);
          const rootRevision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const gitlinkRevision = execFileSync('git', ['ls-files', '-s', '--', sourcePath], { encoding: 'utf8' }).trim().match(/^160000\s+([0-9a-f]{40})\s+\d\t/)?.[1];
          if (!child || child.revision !== process.env.SOURCE_SHA || gitlinkRevision !== process.env.SOURCE_SHA) {
            throw new Error('Provenance refused: generated baseline and root gitlink must match the validated child SHA');
          }
          const provenance = {
            schemaVersion: 1,
            contract: 'validated-submodule-ci-provenance-v1',
            source: {
              repository: process.env.SOURCE_REPOSITORY,
              path: sourcePath,
              revision: process.env.SOURCE_SHA,
              workflow: process.env.SOURCE_WORKFLOW,
              branch: 'refs/heads/main',
              runId: process.env.SOURCE_RUN_ID,
              runUrl: process.env.SOURCE_RUN_URL,
              conclusion: 'success',
            },
            root: {
              repository: 'relgeo/workspace',
              checkoutRevision: rootRevision,
              syncBranch: process.env.SYNC_BRANCH,
            },
            baseline: {
              path: 'docs/integration-baseline.json',
              capturedAt: baseline.capturedAt,
              rootRevision: baseline.rootRevision,
              compatibilityLine: baseline.compatibilityLine,
              childRevision: child?.revision ?? null,
            },
            claim: 'This record links one successful child main push to the exact root gitlink and regenerated baseline candidate; it is not a merge or production-deployment claim.',
          };
          fs.writeFileSync('.local/validated-submodule-ci-provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          NODE

      - name: Upload validated child CI provenance
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: validated-submodule-ci-provenance-${{ steps.metadata.outputs.submodule }}-${{ steps.metadata.outputs.sha }}
          path: |
            .local/validated-submodule-ci-provenance.json
            .local/bootstrap-report.json
            .local/baseline-synchronization-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Open synchronization PR
        if: steps.stage.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ steps.metadata.outputs.sync_branch }}
          delete-branch: true
          title: "chore: sync validated ${{ steps.metadata.outputs.submodule }} ${{ steps.metadata.outputs.sha }}"
          commit-message: "chore: sync validated submodule baseline"
          body: |
            This PR was created from a successful validated child-repository CI run.

            - Submodule: `${{ steps.metadata.outputs.submodule }}`
            - Source repository: `relgeo/${{ steps.metadata.outputs.repository }}`
            - SHA: `${{ steps.metadata.outputs.sha }}`
            - Child CI run: [${{ steps.metadata.outputs.run_id }}](${{ steps.verify-run.outputs.run_url }})
            - Source workflow: `${{ steps.metadata.outputs.workflow }}`
            - Provenance artifact: `validated-submodule-ci-provenance-${{ steps.metadata.outputs.submodule }}-${{ steps.metadata.outputs.sha }}`

            The root gitlink and integration baseline were regenerated only after
            the exact SHA and successful `push`/`main` workflow run were verified.
            The normal `Integration` workflow must pass on this PR before merge.

      - name: Dispatch Integration for the synchronization PR
        if: steps.stage.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ steps.metadata.outputs.sync_branch }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'relgeo',
              repo: 'workspace',
              workflow_id: 'integration.yml',
              ref: process.env.SYNC_BRANCH,
            });
            core.info(`Dispatched Integration for ${process.env.SYNC_BRANCH}.`);
