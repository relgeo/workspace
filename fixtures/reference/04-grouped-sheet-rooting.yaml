version: "0.4"

scene:
  unit: mm

objects:
  panel:
    type: rect
    size: [100, 50]
    place:
      topLeft: [10, 20]

  assembly:
    type: group
    meta:
      stroke: "#ff0000"
    children:
      - panel

views:
  front:
    target: assembly
    scale: "1:1"

sheets:
  drawing1:
    size: A4
    meta:
      title: Grouped Sheet
    views:
      - use: front
        place:
          topLeft: [20, 30]
